entities:
  - name: Driver
    table_name: drivers
    fields:
      id:
        type: integer
      uin:
        type: string
        minLength: 10
        maxLength: 20
      fullName:
        type: string
        minLength: 3
        maxLength: 100
      phoneNumber:
        type: string
        regex: '^[0-9]{10}$'
      gender:
        type: string
        regex: '(Male|Female|Other)'
      driverEmailId:
        type: string
        regex: '^[\w\.-]+@[\w\.-]+\.\w{2,}$'
      city:
        type: string
      faceImagePath:
        type: string
      driverLicenseNumber:
        type: string
        minLength: 5
        maxLength: 20
      passportNumber:
        type: string
        minLength: 8
        maxLength: 15
    required:
      - uin
      - fullName
    emailSource: driverEmailId

  - name: Farmer
    table_name: farmers
    fields:
      id:
        type: integer
      name:
        type: string
        minLength: 3
        maxLength: 50
      phone_number:
        type: string
        regex: '^[0-9]{10}$'
      email:
        type: string
        regex: '^[\w\.-]+@[\w\.-]+\.\w{2,}$'
      district:
        type: string
      village:
        type: string
      date_of_birth:
        type: date
      gender:
        type: string
        regex: '(Male|Female|Other)'
      state:
        type: string
      pin_code:
        type: integer
        minLength: 100000
        maxLength: 999999
      address:
        type: string
      civil_status:
        type: string
      registration_date:
        type: date
        regex: '[0-9]{1,2}-[0-9]{1,2}-[0-9]{4}'
      education_level:
        type: string
      employment_status:
        type: string
      hh_income_type:
        type: string
      total_land_area:
        type: integer
      ownership_type:
        type: string
      land_certificate:
        type: string
      land_id:
        type: integer
      primary_crop:
        type: string
      collected_gc:
        type: string
      season:
        type: string
      secondary_crop:
        type: string
      livestock_type:
        type: string
      livestock_count:
        type: string
    required:
      - name
    emailSource: email


  - name: TruckPass
    table_name: truckpasses
    fields:
      id:
        type: integer
      driverUin:
        type: string
        minLength: 10
        maxLength: 20
      driverName:
        type: string
        minLength: 3
        maxLength: 100
      phoneNumber:
        type: string
        regex: '^[0-9]{10}$'
      gender:
        type: string
        regex: '(Male|Female|Other)'
      emailId:
        type: string
        regex: '^[\w\.-]+@[\w\.-]+\.\w{2,}$'
      city:
        type: string
      faceImagePath:
        type: string
      driverLicenseNumber:
        type: string
        minLength: 5
        maxLength: 20
      passportNumber:
        type: string
        minLength: 8
        maxLength: 15
      invoiceNumber:
        type: string
        minLength: 1
        maxLength: 50
      cmrWaybill:
        type: string
      customsDocumentation:
        type: string
      weightCertificatePath:
        type: string
      vehicleType:
        type: string
      axleSize:
        type: string
      vehicleRegistrationDocsPath:
        type: string
      truckLicensePlate:
        type: string
        minLength: 6
        maxLength: 15
      exporterName:
        type: string
        minLength: 2
        maxLength: 100
      importerName:
        type: string
        minLength: 2
        maxLength: 100
      entryExitPoint:
        type: string
        minLength: 2
        maxLength: 50
      countryOrigin:
        type: string
        minLength: 2
        maxLength: 50
      countryDestination:
        type: string
        minLength: 2
        maxLength: 50
      dateDeparture:
        type: date
        regex: '[0-9]{1,2}-[0-9]{1,2}-[0-9]{4}'
      dateReturn:
        type: date
        regex: '[0-9]{1,2}-[0-9]{1,2}-[0-9]{4}'
    required:
      - driverUin
      - driverName
      - invoiceNumber
      - vehicleType
      - truckLicensePlate
      - exporterName
      - importerName
      - entryExitPoint
      - countryOrigin
      - countryDestination
    emailSource: emailId
