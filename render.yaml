services:
  # OVP verifier backend (Express API) — port assigned by Render via $PORT
  - type: web
    name: inji-mock-ovp-backend
    runtime: node
    plan: free
    rootDir: openid4vp-service
    buildCommand: npm install
    startCommand: node app.js
    autoDeploy: true
    envVars:
      - key: BASE_URL
        value: https://inji-mock-ovp-backend.onrender.com

  # Mock OID4VC Issuer (Express API) — runs as plain HTTP since Render terminates TLS
  - type: web
    name: inji-mock-issuer
    runtime: node
    plan: free
    rootDir: mock-issuer-service
    buildCommand: npm install
    startCommand: node src/server.js
    autoDeploy: true
    envVars:
      - key: USE_HTTPS
        value: "false"
      - key: ISSUER_URL
        value: https://inji-mock-issuer.onrender.com
      - key: VERIFIER_BASE_URL
        value: https://inji-mock-ovp-backend.onrender.com

  # OVP verifier UI (Create React App) — built once and served as a static site
  - type: web
    name: inji-mock-ovp-ui
    runtime: static
    rootDir: openid4vp-service/ovp-client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://inji-mock-ovp-backend.onrender.com
